name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare business logo
        run: base64 -d app/src/main/assets/bravo_logo.png.b64 > app/src/main/assets/bravo_logo.png
      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK signature and alignment
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ElBravoFacturacion-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
